    <main>
        <form action="formproc.html" method="post" id="myForm" class="formstyle">
            <fieldset>
                <legend>Review Form</legend>
                    <div class="formcard">
                        <label for="fullname">Name:</label>
                        <input type="text" name="fullname" id="fullname" placeholder="Mr. Bean">
                    </div>
                    <div class="formcard">
                        <label for="email">Email:</label>
                        <input type="text" name="email" id="email" placeholder="example@gmail.com">
                    </div>
                <div class="formcard">
                    <div>Did you like our site?</div>
                    <label><input type="radio" name="review" id="review" value="yes">Yes</label>
                    <label><input type="radio" name="review" id="review" value="no">No</label>
                </div>
                <div class="formcard">
                    <label for="comments">If so, how come?</label>
                    <textarea name="comments" id="comments" placeholder="Please type here..."></textarea>
                </div>
            </fieldset>
            <input type="submit" value="Submit">
        </form>
    </main>
